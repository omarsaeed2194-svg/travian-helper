<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travian Helper</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/app/src/ui.css">
  <link rel="stylesheet" href="/web.css">
</head>
<body>
  <main class="web-page">
    <form class="web-card" id="loginForm">
      <h1><img src="/favicon.png" alt=""> <span data-t="title"></span></h1>
      <p class="note" data-t="intro"></p>
      <div class="web-setup" id="setup" hidden></div>
      <label><span data-t="password"></span><input type="password" id="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit" data-t="login"></button>
      <p class="msg" id="msg" role="status"></p>
      <p class="note" data-t="travianNote"></p>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
